name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release if not already present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          # If a release for this tag already exists (e.g. created manually in GitHub GUI), exit cleanly
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release for $TAG already exists (likely created manually in GUI). Skipping."
            exit 0
          fi

          gh release create "$TAG" --generate-notes
